foreground = yes
pid =
setuid = stunnel4
setgid = stunnel4
sslVersionMin = TLSv1.2
cert = /etc/letsencrypt/live/airsim-direct/fullchain.pem
key = /etc/letsencrypt/live/airsim-direct/privkey.pem
debug = warning

[airsim-control]
accept = 0.0.0.0:8443
connect = 127.0.0.1:18581
TIMEOUTidle = 120

[airsim-pcm]
accept = 0.0.0.0:17593
connect = 127.0.0.1:18582
TIMEOUTidle = 120
