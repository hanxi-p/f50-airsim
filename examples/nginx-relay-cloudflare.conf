# Install at http{} scope. Replace the example hostname and certificate paths.
# The peer include contains one "CIDR 1;" line per official Cloudflare network.
geo $realip_remote_addr $airsim_edge_peer {
    default 0;
    127.0.0.1 1;
    include /etc/nginx/airsim-cloudflare-peers.conf;
}
map $http_upgrade $airsim_connection {
    default upgrade;
    '' close;
}
map $uri $airsim_register_key {
    default "";
    /v1/devices/register $binary_remote_addr;
}
limit_req_zone $airsim_register_key zone=airsim_register:1m rate=10r/m;

server {
    listen 443 ssl;
    server_name relay.example.com;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($airsim_edge_peer = 0) { return 403; }
    access_log off;
    error_log /var/log/nginx/airsim-relay-error.log crit;
    client_max_body_size 5m;
    limit_req zone=airsim_register burst=15 nodelay;
    limit_req_status 429;

    location ~ ^/(healthz$|v[12]/) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $airsim_connection;
        proxy_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }
    location / { return 404; }
}
